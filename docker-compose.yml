services:
  sanchari-gee-api:
    build: .
    image: sanchari-model:v4
    volumes:
      - ./geotiffs:/app/geotiffs
      - ./predicted:/app/predicted
      # Mac/Linux credential paths:
      - ~/.kaggle:/root/.kaggle
      - ~/.config/earthengine:/root/.config/earthengine
      # Windows credential paths (Uncomment below and comment out Mac/Linux above):
      # - /c/Users/YOUR_USERNAME/.kaggle:/root/.kaggle
      # - /c/Users/YOUR_USERNAME/.config/earthengine:/root/.config/earthengine
    ports:
      - "8001:8001"
    command: uvicorn src.main_gee:app --host 0.0.0.0 --port 8001
    # Uncomment the following to enable GPU support (requires nvidia-container-toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  sanchari-local-api:
    build: .
    image: sanchari-model:v4
    volumes:
      - ./geotiffs:/app/geotiffs
      - ./predicted:/app/predicted
    ports:
      - "8000:8000"
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  cli:
    build: .
    image: sanchari-model:v4
    volumes:
      - ./geotiffs:/app/geotiffs
      - ./predicted:/app/predicted
      # Mac/Linux credential paths:
      - ~/.kaggle:/root/.kaggle
      - ~/.config/earthengine:/root/.config/earthengine
      # Windows credential paths (Uncomment below and comment out Mac/Linux above):
      # - /c/Users/YOUR_USERNAME/.kaggle:/root/.kaggle
      # - /c/Users/YOUR_USERNAME/.config/earthengine:/root/.config/earthengine
    # Intended to be run manually, e.g.: docker compose run cli python src/predict_gee.py
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
